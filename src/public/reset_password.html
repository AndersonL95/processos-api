<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redefinir Senha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      width: 170px;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #111827;
    }

    input[type="password"] {
      width: 90%;
      padding: 0.8rem;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #2563eb;
    }

    #mensagem {
      margin-top: 1rem;
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/DocInHand.png" alt="Logo" class="logo" />
    <h2>Redefinir Senha</h2>
    <form id="resetForm">
      <input type="hidden" id="token" />
      <input type="password" id="newPassword" placeholder="Nova senha" required />
      <button type="submit">Salvar</button>
    </form>
    <p id="mensagem"></p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    document.getElementById('token').value = token;

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('newPassword').value;

      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: novaSenha }),
      });

      const mensagem = document.getElementById('mensagem');
      if (res.ok) {
        mensagem.textContent = 'Senha alterada com sucesso!';
        mensagem.style.color = '#10b981';
      } else {
        mensagem.textContent = 'Erro ao redefinir senha.';
        mensagem.style.color = '#ef4444';
      }
    });
  </script>
</body>
</html>
